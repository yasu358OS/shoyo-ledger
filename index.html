<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>祥燿 帳簿エージェント</title>
<meta name="description" content="複式簿記 仕訳帳・元帳 - 青色申告対応" />
<meta name="theme-color" content="#2B2926" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="祥燿帳簿" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="app">

  <div class="header">
    <div>
      <h1>祥燿 帳簿エージェント</h1>
      <p>複式簿記 仕訳帳・元帳 — 青色申告対応</p>
    </div>
    <button id="settingsBtn" class="settings-btn" title="設定">⚙</button>
  </div>

  <div class="tabs">
    <button class="tab tab-active" data-tab="input"><span class="tab-index">一</span><span class="tab-label">仕訳入力</span></button>
    <button class="tab" data-tab="journal"><span class="tab-index">二</span><span class="tab-label">仕訳帳</span></button>
    <button class="tab" data-tab="ledger"><span class="tab-index">三</span><span class="tab-label">元帳</span></button>
    <button class="tab" data-tab="summary"><span class="tab-index">四</span><span class="tab-label">集計</span></button>
  </div>

  <div id="content" class="content"></div>

  <div id="hanko" class="hanko-wrap">
    <svg viewBox="0 0 120 120" width="88" height="88">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#B23A2E" stroke-width="5" />
      <text x="60" y="45" text-anchor="middle" font-size="26" fill="#B23A2E" font-family="'Noto Serif JP', serif" font-weight="700">記帳</text>
      <text x="60" y="82" text-anchor="middle" font-size="26" fill="#B23A2E" font-family="'Noto Serif JP', serif" font-weight="700">済</text>
    </svg>
  </div>

  <div id="settingsModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>設定</h2>
      <p class="modal-desc">
        レシート自動読み取り(AI)機能を使うには、ご自身の Anthropic API キーが必要です。
        キーはこの端末のブラウザだけに保存され、外部やコードには一切送信・保存されません。
      </p>
      <label class="field">
        <span>Anthropic API キー</span>
        <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off" />
      </label>
      <p class="modal-hint">console.anthropic.com で発行できます。空欄のままなら手入力のみでお使いいただけます。</p>
      <div class="form-actions">
        <button class="btn btn-ghost" id="closeSettings">閉じる</button>
        <button class="btn btn-primary" id="saveSettings">保存する</button>
      </div>
    </div>
  </div>

</div>

<script src="./app.js"></script>
</body>
</html>
